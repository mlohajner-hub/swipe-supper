name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # One fixed signing key, so each new APK installs as an update and keeps your data.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.p12"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk "../swipe-supper-${GITHUB_RUN_NUMBER}.apk"

      # The SHA-256 should stay the same on every run; if it changes, updates won't install over the old app.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs swipe-supper-*.apk | grep -E "SHA-256|DN"

      - uses: actions/upload-artifact@v4
        with:
          name: swipe-supper-apk-${{ github.run_number }}
          path: swipe-supper-*.apk
          retention-days: 30
