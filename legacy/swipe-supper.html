<title>Swipe Supper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column. Sticky header with portion stepper, three views
   (Discover swipe deck, Week planner, Shopping list), bottom tab bar, bottom sheets for recipes and pickers.
   Look: cool grey-green paper, tomato accent for actions, green for "keep", plates drawn from each dish's own ingredient colours. */
:root{
  --bg:#EEF1EA;
  --surface:#FAFBF7;
  --surface2:#E3E9DE;
  --ink:#18231E;
  --muted:#58675F;
  --line:#D0D8CA;
  --accent:#D8432A;
  --accent-ink:#FFFFFF;
  --keep:#2B8559;
  --plate:#FFFFFF;
  --plate2:#F3F1E8;
  --shadow:0 10px 28px rgba(24,35,30,.14);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613;--surface:#17211D;--surface2:#212D28;--ink:#E8EFEA;--muted:#9AABA2;--line:#2B3932;
    --accent:#FF7258;--accent-ink:#1A0D09;--keep:#5CC796;--plate:#E9E6DB;--plate2:#D8D4C7;
    --shadow:0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613;--surface:#17211D;--surface2:#212D28;--ink:#E8EFEA;--muted:#9AABA2;--line:#2B3932;
  --accent:#FF7258;--accent-ink:#1A0D09;--keep:#5CC796;--plate:#E9E6DB;--plate2:#D8D4C7;
  --shadow:0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance}
.app{max-width:520px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px}
.brand{font:700 23px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;margin-top:5px;font:500 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.portions{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.portions button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--ink)}
.portions button:hover:not(:disabled){background:var(--surface2)}
.portions span{min-width:74px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}

/* filters */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{padding:8px 4px;border-radius:9px;text-align:center;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:500;font-size:13px}
.chip .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.diet[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-label{flex:none;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-right:2px}

/* deck */
.deck{position:relative;height:clamp(390px,58vh,540px);margin:10px 0 14px;touch-action:pan-y}
.card{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;will-change:transform}
.card.top{cursor:grab}
.card.dragging{transition:none;cursor:grabbing}
.card:not(.top){pointer-events:none}
.card.pos1{transform:translateY(11px) scale(.96)}
.card.pos2{transform:translateY(22px) scale(.92)}
.art{position:relative;flex:1 1 0;min-height:0;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.art svg{width:min(80%,300px);height:auto;aspect-ratio:1;max-height:94%}
.art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card-body{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
.card h2{font-size:24px;line-height:1.1;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface2)}
.pill.diet{background:color-mix(in srgb,var(--keep) 20%,var(--surface))}
.pill.today{background:var(--accent);color:var(--accent-ink)}
.stamp{position:absolute;top:18px;padding:3px 12px;border:3px solid;border-radius:10px;font:700 22px var(--f-display);letter-spacing:.07em;opacity:0;pointer-events:none;background:color-mix(in srgb,var(--surface) 72%,transparent)}
.stamp.keep{left:16px;color:var(--keep);border-color:var(--keep);transform:rotate(-12deg)}
.stamp.skip{right:16px;color:var(--accent);border-color:var(--accent);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:14px}
.round{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.round.keep{color:var(--keep)}
.round.skip{color:var(--accent)}
.round.small{width:46px;height:46px;box-shadow:none;color:var(--muted)}
.round:active:not(:disabled){transform:scale(.94)}
.status{text-align:center;color:var(--muted);font-size:13px;margin:12px 0 0}
.deck-empty{display:grid;gap:10px;justify-items:start;margin:14px 0;padding:22px 18px;border:1px dashed var(--line);border-radius:20px;background:var(--surface)}
.deck-empty h2{font-size:22px}
.deck-empty p{margin:0;color:var(--muted)}

/* shared bits */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:14px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px}
.h-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.thumb{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.thumb svg{width:92%;height:92%}
.thumb img{width:100%;height:100%;object-fit:cover}

/* week */
.tray{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.mini{flex:none;width:96px;display:grid;gap:6px;text-align:left}
.mini .thumb{width:96px;height:72px;border-radius:14px}
.mini b{font-size:12px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px 12px}
.day.today{border-color:var(--accent)}
.day>header{display:flex;align-items:center;gap:8px;padding:2px 0 8px}
.day>header b{font:700 17px var(--f-display)}
.day>header span{color:var(--muted);font-size:13px}
.slots{display:grid;gap:6px}
.slot{display:flex;align-items:center;gap:8px;min-width:0}
.slot-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px}
.slot-main:hover{background:var(--surface2)}
.slot.empty{width:100%;padding:8px 6px;border:1px dashed var(--line);border-radius:14px;gap:10px}
.slot.empty:hover{background:var(--surface2)}
.plus{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted);background:var(--surface2)}
.slot-txt{display:grid;min-width:0}
.slot-txt small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-txt em{font-style:normal;font-size:12px;color:var(--muted)}
.x{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--surface2);color:var(--ink)}

/* shopping */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--keep);border-radius:inherit}
.summary b{font:700 20px var(--f-display)}
.summary p{margin:2px 0 0;color:var(--muted);font-size:14px}
.aisle{margin-top:16px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--accent-ink)}
.check[aria-checked="true"]{background:var(--keep);border-color:var(--keep)}
.item-txt{display:grid;min-width:0}
.item-txt b{font-weight:600}
.item-txt small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-r{display:grid;justify-items:end;gap:2px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.link{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.item.done .item-txt b,.item.done .amt{text-decoration:line-through;color:var(--muted)}
details.home{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px}
details.home summary{cursor:pointer;padding:12px 0;font-weight:600}
details.home .item:last-child{border-bottom:0}
.empty-view{display:grid;gap:10px;justify-items:start;margin-top:14px;padding:22px 18px;border:1px dashed var(--line);border-radius:20px;background:var(--surface)}
.empty-view h2{font-size:22px}
.empty-view p{margin:0;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,14,11,.55)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet-x{position:sticky;top:10px;float:right;z-index:2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);margin-top:10px}
.sheet-art{margin:16px 0 12px;border-radius:18px;overflow:hidden;height:210px;display:grid}
.sheet-art .art{height:100%}
.sheet-title{font-size:27px;line-height:1.1;letter-spacing:-.015em;margin:4px 0 6px}
.sheet-sec{margin-top:20px}
.sheet-sec h3{font-size:17px;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-btn{padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface2);text-align:center;font-size:13px;font-weight:600}
.day-btn.busy{border-style:dashed}
.day-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
ul.ing,ol.steps{margin:0;padding:0;list-style:none}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
ul.ing li span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
ol.steps{counter-reset:s;display:grid;gap:12px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:13px}
.note{color:var(--muted);font-size:12px;margin:18px 0 0}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:8px 4px;border-radius:12px}
.pick:hover{background:var(--surface2)}
.pick .slot-txt b{white-space:normal}
textarea.copybox{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px;font:14px/1.5 var(--f-body)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Swipe Supper<small id="weekLabel">This week</small></div>
    <div class="portions" role="group" aria-label="Portions">
      <button data-act="portions" data-a="-1" aria-label="Fewer people" id="pMinus">&minus;</button>
      <span id="pLabel" aria-live="polite">2 people</span>
      <button data-act="portions" data-a="1" aria-label="More people" id="pPlus">+</button>
    </div>
  </header>
  <main>
    <section id="view-discover" aria-label="Discover recipes"></section>
    <section id="view-week" aria-label="Week plan" hidden></section>
    <section id="view-shop" aria-label="Shopping list" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button data-act="tab" data-a="discover" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>Discover</button>
    <button data-act="tab" data-a="week" aria-current="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Week<span class="badge" id="badgeWeek" hidden></span></button>
    <button data-act="tab" data-a="shop" aria-current="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.6 9a2 2 0 0 1-2 1.7H7.6a2 2 0 0 1-2-1.7L4 9z"/><path d="M9 9l3-5 3 5"/></svg>Shopping<span class="badge" id="badgeShop" hidden></span></button>
  </div>
</nav>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <div class="backdrop" data-act="close"></div>
  <div class="sheet-panel" id="sheetPanel" tabindex="-1">
    <button class="sheet-x" data-act="close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script>

  basil:["Fresh basil","g",aP,"","#3E8F3E"],
  banana:["Bananas","pcs",aP,"","#F0D262"],

function resetCard(c){c.style.transform='';c.querySelectorAll('.stamp').forEach(function(s){s.style.opacity=0})}

  busy=true;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,id=c.dataset.id;
  c.querySelector(dir>0?'.stamp.keep':'.stamp.skip').style.opacity=1;

  c.style.transform='translate('+dir*(window.innerWidth+80)+'px,'+dy+'px) rotate('+dir*22+'deg)';
  c.style.opacity=0;

}

function decide(id,dir){
  st.liked=st.liked.filter(function(x){return x!==id});st.skipped=st.skipped.filter(function(x){return x!==id});
  (dir>0?st.liked:st.skipped).push(id);

}
function undo(){
  var h=history.pop();if(!h)return;

(function(){
  var vd=$('view-discover');
  vd.addEventListener('pointerdown',function(e){
    if(busy||e.button>0)return;var c=e.target.closest('.card.top');if(!c)return;
    drag={c:c,id:c.dataset.id,x:e.clientX,y:e.clientY,dx:0,dy:0,t:performance.now(),moved:false,pid:e.pointerId};
    try{c.setPointerCapture(e.pointerId)}catch(err){}
    c.classList.add('dragging');
  });
  vd.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid)return;
    drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
    if(Math.abs(drag.dx)>6||Math.abs(drag.dy)>6)drag.moved=true;
    drag.c.style.transform='translate('+drag.dx+'px,'+drag.dy*.4+'px) rotate('+drag.dx/18+'deg)';
    drag.c.querySelector('.stamp.keep').style.opacity=Math.max(0,Math.min(1,drag.dx/90));
    drag.c.querySelector('.stamp.skip').style.opacity=Math.max(0,Math.min(1,-drag.dx/90));
  });
  function end(e,cancel){
    if(!drag||e.pointerId!==drag.pid)return;
    var d=drag;drag=null;d.c.classList.remove('dragging');
    var dt=Math.max(1,performance.now()-d.t),speed=Math.abs(d.dx)/dt;
    if(!cancel&&!d.moved&&dt<500){resetCard(d.c);openRecipe(d.id);return}
    if(!cancel&&(Math.abs(d.dx)>110||(Math.abs(d.dx)>45&&speed>.55)))flyOut(d.c,d.dx>0?1:-1,d.dy*.4);
    else resetCard(d.c);
  }
  vd.addEventListener('pointerup',function(e){end(e,false)});
  vd.addEventListener('pointercancel',function(e){end(e,true)});
})();

function fillWeek(){
  var filled=0,missing={},use={};
  Object.keys(st.plan).forEach(function(k){use[st.plan[k]]=(use[st.plan[k]]||0)+1});
  enabledMeals().forEach(function(m){
    var pool=st.liked.map(function(id){return BYID[id]}).filter(function(r){return r&&r.meals.indexOf(m)>-1});
    for(var d=0;d<7;d++){
      var key=d+'-'+m;if(st.plan[key])continue;
      if(!pool.length){missing[m]=1;continue}
      var min=Math.min.apply(null,pool.map(function(r){return use[r.id]||0}));
      var c=pool.filter(function(r){return (use[r.id]||0)===min});
      var r=c[Math.floor(Math.random()*c.length)];
      st.plan[key]=r.id;use[r.id]=(use[r.id]||0)+1;filled++;
    }
  });
  save();renderAll();
  var miss=Object.keys(missing);
  toast(filled?('Filled '+filled+(filled===1?' slot':' slots')+(miss.length?'. No kept '+miss.join(' or ')+' recipes yet.':'')):(miss.length?'Keep some '+miss.join(' or ')+' recipes first.':'Every slot is already filled.'));

/* ---------- shopping ---------- */
function computeList(){
  var f=st.portions/2,tot={},uses={},meals=0;
  enabledMeals().forEach(function(m){for(var d=0;d<7;d++){
    var r=BYID[st.plan[d+'-'+m]];if(!r)continue;meals++;
    r.ings.forEach(function(p){tot[p[0]]=(tot[p[0]]||0)+p[1]*f;(uses[p[0]]=uses[p[0]]||{})[r.name]=1});
  }});
  var haveSet={};st.have.forEach(function(k){haveSet[k]=1});
  var items=Object.keys(tot).map(function(k){return {key:k,name:ING[k][0],aisle:ING[k][2],qty:shopQty(k,tot[k]),uses:Object.keys(uses[k]).join(', ')}});
  items.sort(function(a,b){return AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle)||a.name.localeCompare(b.name)});
  return {meals:meals,buy:items.filter(function(i){return !haveSet[i.key]}),home:items.filter(function(i){return haveSet[i.key]})};
}
function shopQty(k,total){
  var u=ING[k][1],v;
  if(u==='g'||u==='ml'){var step=total<100?5:10;v=Math.ceil(total/step-1e-9)*step;return v>=1000?trim1(v/1000)+(u==='g'?' kg':' l'):v+' '+u}
  if(u==='tbsp'||u==='tsp'){v=Math.ceil(total*2-1e-9)/2;return frac(v)+' '+u}
  v=Math.ceil(total-1e-9);return u==='pcs'?String(v):v+' '+u;
}
function recQty(k,a){
  var u=ING[k][1],v=a*st.portions/2;
  if(u==='g'||u==='ml'){v=v<100?Math.round(v/5)*5:Math.round(v/10)*10;if(!v)v=5;return v>=1000?trim1(v/1000)+(u==='g'?' kg':' l'):v+' '+u}
  v=Math.round(v*4)/4;if(!v)v=.25;return frac(v)+(u==='pcs'?'':' '+u);
}

var photoFor=null;
function fileToJpeg(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){var im=new Image();im.onerror=rej;
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');
        c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
        var url=c.toDataURL('image/jpeg',q);
        if(url.length>190000&&max>360)fileToJpeg(file,max-160,q-.1).then(res,rej);else res(url);
      };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function setPhoto(id,url){
  photos[id]=url;try{localStorage.setItem('ss.p.'+id,url)}catch(e){}
  if(remotePhotos){try{remotePhotos.doc(id).set({img:url}).catch(function(){})}catch(e){}}
}
function delPhoto(id){
  delete photos[id];try{localStorage.removeItem('ss.p.'+id)}catch(e){}
  if(remotePhotos){try{remotePhotos.doc(id).delete().catch(function(){})}catch(e){}}
}
$('photoInput').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f||!photoFor)return;var id=photoFor;
  fileToJpeg(f,720,.78).then(function(url){setPhoto(id,url);renderAll();if(sheetState&&sheetState.type==='recipe')paintRecipe(true);toast('Photo saved')}).catch(function(){toast('Could not read that image')});
});

/* ---------- render all ---------- */
function renderHeader(){
  $('pLabel').textContent=ppl(st.portions);$('pMinus').disabled=st.portions<=1;$('pPlus').disabled=st.portions>=5;
  $('weekLabel').textContent='Week '+isoWeek(new Date());
}
function renderTabs(){
  var planned=0;enabledMeals().forEach(function(m){for(var d=0;d<7;d++)if(BYID[st.plan[d+'-'+m]])planned++});
  var L=computeList(),left=L.buy.filter(function(i){return !st.done[i.key]}).length;
  var bw=$('badgeWeek'),bs=$('badgeShop');
  bw.hidden=!planned;bw.textContent=planned;bs.hidden=!left;bs.textContent=left;
}
function renderAll(){
  var ae=document.activeElement,sel=null;
  if(ae&&ae.dataset&&ae.dataset.act&&!sheet.contains(ae))sel='[data-act="'+ae.dataset.act+'"]'+(ae.dataset.a!==undefined?'[data-a="'+ae.dataset.a+'"]':'')+(ae.dataset.b!==undefined?'[data-b="'+ae.dataset.b+'"]':'');
  renderHeader();renderDiscover();renderWeek();renderShop();renderTabs();
  if(sel){try{var el=document.querySelector('main '+sel+':not(:disabled)')||document.querySelector(sel+':not(:disabled)');if(el)el.focus({preventScroll:true})}catch(e){}}
}
var tab='discover';
function setTab(t){
  tab=t;['discover','week','shop'].forEach(function(n){$('view-'+n).hidden=n!==t});
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-current',b.dataset.a===t?'page':'false')});
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,a=t.dataset.a,b=t.dataset.b,c=t.dataset.c,i;
  switch(act){
    case 'tab':closeSheet();setTab(a);break;
    case 'portions':st.portions=Math.max(1,Math.min(5,st.portions+(+a)));save();renderAll();if(sheetState&&sheetState.type==='recipe')paintRecipe(true);break;
    case 'mealfilter':st.mealFilter=a;save();renderAll();break;
    case 'tag':st.tag=a;save();renderAll();break;
    case 'diet':i=st.diet.indexOf(a);if(i>-1)st.diet.splice(i,1);else st.diet.push(a);save();renderAll();break;
    case 'swipe':swipeTop(a==='keep'?1:-1);break;
    case 'undo':undo();break;
    case 'info':var tc=document.querySelector('.card.top');if(tc)openRecipe(tc.dataset.id);break;
    case 'resetskipped':st.skipped=[];save();renderAll();break;
    case 'open':openRecipe(a);break;
    case 'close':closeSheet();break;
    case 'like':
      if(st.liked.indexOf(a)>-1)st.liked=st.liked.filter(function(x){return x!==a});
      else{st.liked.push(a);st.skipped=st.skipped.filter(function(x){return x!==a})}
      save();renderAll();paintRecipe(true);break;
    case 'sheetmeal':sheetState.meal=a;paintRecipe(true);break;
    case 'setplan':
      var k=a+'-'+b;
      if(st.plan[k]===c){delete st.plan[k];toast('Removed from '+DAYS_LONG[+a])}
      else{st.plan[k]=c;st.meals[b]=true;if(st.liked.indexOf(c)<0)st.liked.push(c);st.skipped=st.skipped.filter(function(x){return x!==c});toast('Planned for '+DAYS_LONG[+a]+' '+b)}
      save();renderAll();paintRecipe(true);break;
    case 'slot':openPicker(+a,b);break;
    case 'unslot':delete st.plan[a+'-'+b];save();renderAll();break;
    case 'pick':
      st.plan[a+'-'+b]=c;if(st.liked.indexOf(c)<0)st.liked.push(c);st.skipped=st.skipped.filter(function(x){return x!==c});
      save();closeSheet();renderAll();toast('Added to '+DAYS_LONG[+a]);break;
    case 'surprise':
      var pool=st.liked.map(function(id){return BYID[id]}).filter(function(r){return r&&r.meals.indexOf(b)>-1});
      if(pool.length){var used={};Object.keys(st.plan).forEach(function(q){used[st.plan[q]]=1});var fresh=pool.filter(function(r){return !used[r.id]});var from=fresh.length?fresh:pool;var r=from[Math.floor(Math.random()*from.length)];
        st.plan[a+'-'+b]=r.id;save();closeSheet();renderAll();toast(r.name)}
      break;
    case 'mealtoggle':
      st.meals[a]=!st.meals[a];if(!enabledMeals().length)st.meals[a]=true;save();renderAll();break;
    case 'fill':fillWeek();break;
    case 'clearweek':
      if(!clearArmed){clearArmed=true;renderWeek();setTimeout(function(){if(clearArmed){clearArmed=false;renderWeek()}},3500)}
      else{clearArmed=false;st.plan={};save();renderAll();toast('Week cleared')}
      break;
    case 'tick':if(st.done[a])delete st.done[a];else st.done[a]=true;save();renderAll();break;
    case 'untick':st.done={};save();renderAll();break;
    case 'have':if(st.have.indexOf(a)<0)st.have.push(a);save();renderAll();toast('Moved to At home');break;
    case 'need':st.have=st.have.filter(function(x){return x!==a});save();renderAll();toast('Back on the list');break;
    case 'copy':
      var text=listText();
      var fallback=function(){sheetState={type:'copy'};openSheet('<h2 class="sheet-title" style="margin-top:18px">Shopping list</h2><p style="color:var(--muted)">Select all and copy.</p><textarea class="copybox" id="copybox" readonly></textarea>','Shopping list');var tb=$('copybox');tb.value=text;tb.focus();tb.select()};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('List copied')},fallback)}else fallback();
      break;
    case 'photoadd':photoFor=a;$('photoInput').click();break;
    case 'photodel':delPhoto(a);renderAll();paintRecipe(true);toast('Photo removed');break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheet.classList.contains('open')){closeSheet();return}
  if(sheet.classList.contains('open')||tab!=='discover')return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key==='ArrowRight'){e.preventDefault();swipeTop(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();swipeTop(-1)}
});

renderAll();
initRemote();
})();
</script>
